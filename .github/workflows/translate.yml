name: Quota-aware localization queue

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Hugging Face project ID
        required: true
        type: string
      workers:
        description: Compatibility input; quota dispatcher uses one request lane
        required: true
        default: "1"
        type: string
      run_id:
        description: Unique tracking run ID
        required: true
        type: string

concurrency:
  group: gemini-localization-queue
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build compact queue and checkpoint map
        run: node scripts/coordinate-project.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          WORKER_COUNT: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}

  analyze:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify compact IDs and freeze glossary
        run: node scripts/analyze-project.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  translate:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Translate compact token-sized batches
        run: node scripts/translate-worker.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          WORKER_INDEX: "0"
          WORKER_COUNT: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  review:
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review compact batches against frozen glossary
        run: node scripts/review-project.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
