name: Translate project

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Hugging Face project ID
        required: true
        type: string
      workers:
        description: Number of parallel workers
        required: true
        default: "12"
        type: string
      run_id:
        description: Unique tracking run ID
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - id: matrix
        name: Prepare worker matrix
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          count="$WORKERS"
          if [ "$count" -lt 1 ]; then count=1; fi
          if [ "$count" -gt 16 ]; then count=16; fi
          shards=$(seq 0 $((count - 1)) | jq -R -s -c 'split("\n")[:-1] | map(tonumber)')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  translate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Translate shard
        run: node scripts/translate-worker.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare.outputs.count }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  review:
    needs: [prepare, translate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review completed translation
        run: node scripts/review-project.mjs
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          SHARD_COUNT: ${{ needs.prepare.outputs.count }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
